<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TaskFlow Pro – Supabase Schema Installer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f23; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: #1a1a2e; border: 1px solid #2d2d4e; border-radius: 16px; padding: 40px; max-width: 640px; width: 100%; margin: 24px; }
    h1 { font-size: 22px; font-weight: 700; color: #818cf8; margin-bottom: 8px; }
    p { color: #94a3b8; font-size: 14px; margin-bottom: 24px; line-height: 1.6; }
    .status { padding: 14px 18px; border-radius: 10px; margin-bottom: 16px; font-size: 14px; display: none; }
    .status.info  { background: #1e3a5f; border: 1px solid #3b82f6; color: #93c5fd; display: block; }
    .status.ok    { background: #0d3320; border: 1px solid #22c55e; color: #86efac; display: block; }
    .status.error { background: #3b0d0d; border: 1px solid #ef4444; color: #fca5a5; display: block; }
    .log { background: #0d0d1a; border: 1px solid #2d2d4e; border-radius: 10px; padding: 16px; font-family: monospace; font-size: 12px; max-height: 300px; overflow-y: auto; margin-bottom: 20px; line-height: 1.8; }
    .log-line.ok    { color: #86efac; }
    .log-line.err   { color: #fca5a5; }
    .log-line.info  { color: #93c5fd; }
    .log-line.warn  { color: #fcd34d; }
    button { width: 100%; padding: 14px; background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity .2s; }
    button:hover { opacity: .9; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; background: #2d2d4e; color: #818cf8; margin-right: 6px; }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #fff3; border-top-color: white; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="card">
  <h1>⚡ TaskFlow Pro – Schema Installer</h1>
  <p>This tool will apply the complete PostgreSQL schema to your Supabase project:<br>
  <span class="badge">pvarfuokguxoudrjihmy.supabase.co</span> — <strong>users</strong>, <strong>categories</strong>, <strong>tasks</strong> tables, indexes, triggers &amp; RLS policies.</p>

  <div id="status" class="status info">Click "Apply Schema" to create all database tables.</div>
  <div id="log" class="log" style="display:none"></div>
  <button id="btn" onclick="runSchema()">⚡ Apply Schema to Supabase</button>
</div>

<script>
const SUPABASE_URL = 'https://pvarfuokguxoudrjihmy.supabase.co';
const SERVICE_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB2YXJmdW9rZ3V4b3VkcmppaG15Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5MTM2NDk0NSwiZXhwIjoyMTA2OTQwOTQ1fQ.zoaXr7CdlwD9ioU7qnIDWuDkC3zGf82R4RTVmUDyh90';

// Complete SQL split into individual atomic statements
const SQL_STATEMENTS = [
  `CREATE EXTENSION IF NOT EXISTS "pgcrypto"`,
  `DROP TRIGGER IF EXISTS trigger_tasks_updated_at ON tasks`,
  `DROP TRIGGER IF EXISTS trigger_tasks_completed_at ON tasks`,
  `DROP TRIGGER IF EXISTS trigger_categories_updated_at ON categories`,
  `DROP TRIGGER IF EXISTS trigger_users_updated_at ON users`,
  `DROP FUNCTION IF EXISTS update_timestamp CASCADE`,
  `DROP FUNCTION IF EXISTS sync_task_completed_at CASCADE`,
  `DROP TABLE IF EXISTS tasks CASCADE`,
  `DROP TABLE IF EXISTS categories CASCADE`,
  `DROP TABLE IF EXISTS users CASCADE`,
  `CREATE TABLE users (
    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    name VARCHAR(50) NOT NULL,
    email VARCHAR(255) NOT NULL UNIQUE,
    password TEXT NOT NULL,
    avatar TEXT DEFAULT '',
    role VARCHAR(20) DEFAULT 'user' CHECK (role IN ('user', 'admin')),
    bio VARCHAR(200) DEFAULT '',
    theme_preference VARCHAR(10) DEFAULT 'dark' CHECK (theme_preference IN ('dark', 'light')),
    is_active BOOLEAN DEFAULT true,
    created_at TIMESTAMPTZ DEFAULT NOW(),
    updated_at TIMESTAMPTZ DEFAULT NOW()
  )`,
  `CREATE TABLE categories (
    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    user_id UUID NOT NULL REFERENCES users(id) ON DELETE CASCADE,
    name VARCHAR(40) NOT NULL,
    color VARCHAR(20) DEFAULT '#6366f1',
    description VARCHAR(150) DEFAULT '',
    icon VARCHAR(10) DEFAULT '📁',
    created_at TIMESTAMPTZ DEFAULT NOW(),
    updated_at TIMESTAMPTZ DEFAULT NOW(),
    CONSTRAINT categories_user_id_name_unique UNIQUE (user_id, name)
  )`,
  `CREATE TABLE tasks (
    id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
    user_id UUID NOT NULL REFERENCES users(id) ON DELETE CASCADE,
    category_id UUID REFERENCES categories(id) ON DELETE SET NULL,
    title VARCHAR(120) NOT NULL,
    description TEXT DEFAULT '',
    status VARCHAR(20) DEFAULT 'To Do' CHECK (status IN ('To Do', 'In Progress', 'Completed', 'Archived')),
    priority VARCHAR(20) DEFAULT 'Medium' CHECK (priority IN ('Low', 'Medium', 'High', 'Urgent')),
    due_date TIMESTAMPTZ DEFAULT NULL,
    tags JSONB DEFAULT '[]'::jsonb,
    subtasks JSONB DEFAULT '[]'::jsonb,
    notes TEXT DEFAULT '',
    is_favorite BOOLEAN DEFAULT false,
    order_index INTEGER DEFAULT 0,
    completed_at TIMESTAMPTZ DEFAULT NULL,
    created_at TIMESTAMPTZ DEFAULT NOW(),
    updated_at TIMESTAMPTZ DEFAULT NOW()
  )`,
  `CREATE INDEX IF NOT EXISTS idx_users_email ON users(email)`,
  `CREATE INDEX IF NOT EXISTS idx_users_role ON users(role)`,
  `CREATE INDEX IF NOT EXISTS idx_categories_user_id ON categories(user_id)`,
  `CREATE INDEX IF NOT EXISTS idx_categories_name ON categories(name)`,
  `CREATE INDEX IF NOT EXISTS idx_tasks_user_id ON tasks(user_id)`,
  `CREATE INDEX IF NOT EXISTS idx_tasks_category_id ON tasks(category_id)`,
  `CREATE INDEX IF NOT EXISTS idx_tasks_user_status ON tasks(user_id, status)`,
  `CREATE INDEX IF NOT EXISTS idx_tasks_user_priority ON tasks(user_id, priority)`,
  `CREATE INDEX IF NOT EXISTS idx_tasks_user_due_date ON tasks(user_id, due_date)`,
  `CREATE INDEX IF NOT EXISTS idx_tasks_user_created_at ON tasks(user_id, created_at DESC)`,
  `CREATE INDEX IF NOT EXISTS idx_tasks_is_favorite ON tasks(user_id, is_favorite)`,
  `CREATE INDEX IF NOT EXISTS idx_tasks_tags_gin ON tasks USING GIN (tags)`,
  `CREATE OR REPLACE FUNCTION update_timestamp()
   RETURNS TRIGGER AS $$
   BEGIN NEW.updated_at = NOW(); RETURN NEW; END;
   $$ LANGUAGE plpgsql`,
  `CREATE TRIGGER trigger_users_updated_at BEFORE UPDATE ON users FOR EACH ROW EXECUTE FUNCTION update_timestamp()`,
  `CREATE TRIGGER trigger_categories_updated_at BEFORE UPDATE ON categories FOR EACH ROW EXECUTE FUNCTION update_timestamp()`,
  `CREATE TRIGGER trigger_tasks_updated_at BEFORE UPDATE ON tasks FOR EACH ROW EXECUTE FUNCTION update_timestamp()`,
  `CREATE OR REPLACE FUNCTION sync_task_completed_at()
   RETURNS TRIGGER AS $$
   BEGIN
     IF NEW.status = 'Completed' AND OLD.status IS DISTINCT FROM 'Completed' THEN
       NEW.completed_at = COALESCE(NEW.completed_at, NOW());
     ELSIF NEW.status <> 'Completed' THEN
       NEW.completed_at = NULL;
     END IF;
     RETURN NEW;
   END;
   $$ LANGUAGE plpgsql`,
  `CREATE TRIGGER trigger_tasks_completed_at BEFORE INSERT OR UPDATE OF status ON tasks FOR EACH ROW EXECUTE FUNCTION sync_task_completed_at()`,
  `ALTER TABLE users ENABLE ROW LEVEL SECURITY`,
  `ALTER TABLE categories ENABLE ROW LEVEL SECURITY`,
  `ALTER TABLE tasks ENABLE ROW LEVEL SECURITY`,
  `DO $$ BEGIN
     IF NOT EXISTS (SELECT 1 FROM pg_policies WHERE tablename='users' AND policyname='Full access for service role on users') THEN
       CREATE POLICY "Full access for service role on users" ON users FOR ALL USING (true) WITH CHECK (true);
     END IF;
   END $$`,
  `DO $$ BEGIN
     IF NOT EXISTS (SELECT 1 FROM pg_policies WHERE tablename='categories' AND policyname='Full access for service role on categories') THEN
       CREATE POLICY "Full access for service role on categories" ON categories FOR ALL USING (true) WITH CHECK (true);
     END IF;
   END $$`,
  `DO $$ BEGIN
     IF NOT EXISTS (SELECT 1 FROM pg_policies WHERE tablename='tasks' AND policyname='Full access for service role on tasks') THEN
       CREATE POLICY "Full access for service role on tasks" ON tasks FOR ALL USING (true) WITH CHECK (true);
     END IF;
   END $$`,
];

function log(msg, type = 'info') {
  const logEl = document.getElementById('log');
  logEl.style.display = 'block';
  const line = document.createElement('div');
  line.className = 'log-line ' + type;
  line.textContent = msg;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

function setStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + type;
}

async function execSQL(sql) {
  // Use Supabase's pg REST endpoint via RPC approach via service key
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SERVICE_KEY,
      'Authorization': `Bearer ${SERVICE_KEY}`,
      'Prefer': 'return=minimal',
    },
    body: JSON.stringify({ query: sql }),
  });
  return res;
}

// Alternative: Use Supabase's internal DB gateway
async function execSQLDirect(sql) {
  const res = await fetch(`${SUPABASE_URL}/pg/query`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SERVICE_KEY,
      'Authorization': `Bearer ${SERVICE_KEY}`,
    },
    body: JSON.stringify({ query: sql }),
  });
  const text = await res.text();
  return { status: res.status, body: text };
}

async function runSchema() {
  const btn = document.getElementById('btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Applying schema…';
  
  log('🔌 Connecting to: ' + SUPABASE_URL, 'info');

  // First test: try the /pg/query internal endpoint
  const testRes = await execSQLDirect('SELECT 1 as test');
  log('Gateway test status: ' + testRes.status, testRes.status === 200 ? 'ok' : 'warn');

  if (testRes.status === 200) {
    log('✅ Direct SQL gateway available! Applying schema…', 'ok');
    let ok = 0, fail = 0;
    
    for (const stmt of SQL_STATEMENTS) {
      const preview = stmt.trim().split('\n')[0].substring(0, 60);
      const r = await execSQLDirect(stmt);
      
      if (r.status === 200 || r.status === 204) {
        log('✅ ' + preview, 'ok');
        ok++;
      } else {
        const err = (() => { try { return JSON.parse(r.body).message || r.body; } catch(e) { return r.body; } })();
        // Ignore "already exists" type errors
        if (err && (err.includes('already exists') || err.includes('does not exist'))) {
          log('⚠️ SKIP ' + preview + ' → ' + err.substring(0, 60), 'warn');
          ok++;
        } else {
          log('❌ ' + preview + ' → ' + (err || r.status).toString().substring(0, 80), 'err');
          fail++;
        }
      }
    }

    if (fail === 0) {
      setStatus('✅ Schema applied successfully! All tables created. You can close this page and use the app.', 'ok');
      log('\n🎉 Done! ' + ok + ' statements executed. Reload your Task Manager app!', 'ok');
    } else {
      setStatus('⚠️ Schema applied with ' + fail + ' errors. Check the log above.', 'error');
    }
    
    btn.textContent = 'Done – Close this page';
    btn.disabled = false;
    btn.onclick = () => window.close();
    return;
  }

  // Fallback: show manual instructions
  log('⚠️ Direct SQL endpoint not available on this plan.', 'warn');
  log('➡️ Please apply the schema manually via the Supabase Dashboard.', 'info');
  setStatus('⚠️ Please follow the manual instructions below.', 'error');
  
  btn.innerHTML = '📋 Open Supabase SQL Editor';
  btn.disabled = false;
  btn.onclick = () => window.open(
    'https://supabase.com/dashboard/project/pvarfuokguxoudrjihmy/sql/new',
    '_blank'
  );
}
</script>
</body>
</html>
