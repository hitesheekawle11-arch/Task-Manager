<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | TaskFlow Pro</title>
  <meta name="description" content="Create a new TaskFlow Pro account to organize tasks and boost productivity.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background: radial-gradient(circle at 50% 10%, rgba(99, 102, 241, 0.12) 0%, transparent 60%);
    }
    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-xl);
      padding: 2.5rem;
      width: 100%;
      max-width: 480px;
      backdrop-filter: blur(16px);
    }
  </style>
</head>
<body class="auth-page">
  <div class="auth-card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.75rem;">
      <a href="index.html" style="display: flex; align-items: center; gap: 0.6rem; text-decoration: none;">
        <div class="brand-icon">✓</div>
        <span style="font-weight: 800; font-size: 1.25rem; color: var(--text-primary);">TaskFlow<span style="color:var(--primary);">Pro</span></span>
      </a>
      <button class="btn btn-icon btn-secondary btn-sm" id="theme-toggle-btn" onclick="Auth.toggleTheme()" title="Toggle Theme">☀️</button>
    </div>

    <h2 style="font-size: 1.6rem; margin-bottom: 0.4rem;">Create your account</h2>
    <p style="color: var(--text-secondary); font-size: 0.875rem; margin-bottom: 1.75rem;">
      Start organizing projects, tasks, and deadlines today.
    </p>

    <form id="register-form">
      <div class="form-group">
        <label class="form-label" for="reg-name">Full Name</label>
        <input type="text" id="reg-name" class="form-input" placeholder="e.g. John Doe" required autocomplete="name" />
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-email">Email Address</label>
        <input type="email" id="reg-email" class="form-input" placeholder="you@example.com" required autocomplete="email" />
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label class="form-label" for="reg-password">Password</label>
          <input type="password" id="reg-password" class="form-input" placeholder="Min. 6 chars" minlength="6" required autocomplete="new-password" />
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-confirm-password">Confirm Password</label>
          <input type="password" id="reg-confirm-password" class="form-input" placeholder="Re-enter password" minlength="6" required autocomplete="new-password" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="reg-role">Account Role</label>
        <select id="reg-role" class="form-select">
          <option value="user" selected>Standard User (Personal & Team Tasks)</option>
          <option value="admin">Administrator (Full System & User Control)</option>
        </select>
        <span class="form-hint">Administrators can view all users and system-wide statistics.</span>
      </div>

      <button type="submit" id="reg-submit-btn" class="btn btn-primary" style="width: 100%; margin-top: 0.75rem; padding: 0.75rem;">
        Complete Registration
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-secondary);">
      Already have an account? <a href="login.html" style="font-weight: 600;">Sign in here</a>
    </div>
  </div>

  <script src="js/notifications.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    Auth.redirectIfAuthenticated();

    const regForm = document.getElementById('register-form');
    regForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirmPwd = document.getElementById('reg-confirm-password').value;
      const role = document.getElementById('reg-role').value;
      const submitBtn = document.getElementById('reg-submit-btn');

      if (password !== confirmPwd) {
        Toast.error('Passwords do not match');
        return;
      }

      if (password.length < 6) {
        Toast.error('Password must be at least 6 characters');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account...';

      try {
        await Auth.register(name, email, password, role);
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 500);
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Complete Registration';
      }
    });
  </script>
</body>
</html>
